name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/adapters/go/worker/go.mod
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify Go adapter
        working-directory: src/adapters/go/worker
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - run: dotnet restore Merkle.slnx
      - run: dotnet restore src/cli/Merkle.Cli.csproj --runtime ${{ matrix.rid }}
      - run: dotnet list Merkle.slnx package --vulnerable --include-transitive
      - run: dotnet build Merkle.slnx --configuration Release --no-restore --warnaserror
      - run: dotnet format Merkle.slnx --no-restore --verify-no-changes
      - run: dotnet test tests/Merkle.Tests/Merkle.Tests.csproj --configuration Release --no-build --no-restore
      - run: dotnet publish src/cli/Merkle.Cli.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/${{ matrix.rid }}
      - name: Smoke native package
        shell: bash
        run: |
          artifacts/${{ matrix.rid }}/Merkle.Cli --help
          test -f artifacts/${{ matrix.rid }}/workers/dotnet/Merkle.Adapters.DotNet.Worker.dll
          test -f artifacts/${{ matrix.rid }}/workers/dotnet/Merkle.Adapters.DotNet.Observer.dll
          test -x artifacts/${{ matrix.rid }}/workers/go/merkle-adapter-go
          printf '%s' '{"protocolVersion":"1.0","requestId":"smoke","operation":"describe","payload":{}}' \
            | artifacts/${{ matrix.rid }}/workers/go/merkle-adapter-go \
            | grep -q '"language":"golang"'
      - uses: actions/upload-artifact@v7
        with:
          name: merkle-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
