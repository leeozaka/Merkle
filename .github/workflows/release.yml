name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Merkle.slnx
      - run: dotnet restore src/cli/Merkle.Cli.csproj --runtime ${{ matrix.rid }}
      - run: dotnet list Merkle.slnx package --vulnerable --include-transitive
      - run: dotnet build Merkle.slnx --configuration Release --no-restore --warnaserror
      - run: dotnet publish src/cli/Merkle.Cli.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/merkle-${{ matrix.rid }}
      - name: Smoke native package
        shell: bash
        run: |
          artifacts/merkle-${{ matrix.rid }}/Merkle.Cli --help
          test -f artifacts/merkle-${{ matrix.rid }}/workers/dotnet/Merkle.Adapters.DotNet.Worker.dll
          test -f artifacts/merkle-${{ matrix.rid }}/workers/dotnet/Merkle.Adapters.DotNet.Observer.dll
      - name: Package
        shell: bash
        run: |
          tar -C artifacts -czf artifacts/merkle-${{ matrix.rid }}.tar.gz merkle-${{ matrix.rid }}
          shasum -a 256 artifacts/merkle-${{ matrix.rid }}.tar.gz > artifacts/merkle-${{ matrix.rid }}.tar.gz.sha256
      - uses: actions/attest@v4
        with:
          subject-path: artifacts/merkle-${{ matrix.rid }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/merkle-${{ matrix.rid }}.tar.gz
            artifacts/merkle-${{ matrix.rid }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --verify-tag --generate-notes
