name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/adapters/go/worker/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Merkle.slnx
      - run: dotnet restore src/cli/Merkle.Cli.csproj --runtime ${{ matrix.rid }}
      - run: dotnet list Merkle.slnx package --vulnerable --include-transitive
      - run: dotnet build Merkle.slnx --configuration Release --no-restore --warnaserror
      - name: Build the pinned release adapter set
        run: ./build publish --adapters dotnet,golang,python,java --adapter-policy strict --runtime ${{ matrix.rid }} --output artifacts/merkle-${{ matrix.rid }}
      - name: Smoke native package
        shell: bash
        run: |
          artifacts/merkle-${{ matrix.rid }}/Merkle.Cli --help
          test -f artifacts/merkle-${{ matrix.rid }}/workers/dotnet/Merkle.Adapters.DotNet.Worker.dll
          test -f artifacts/merkle-${{ matrix.rid }}/workers/dotnet/Merkle.Adapters.DotNet.Observer.dll
          test -x artifacts/merkle-${{ matrix.rid }}/workers/go/merkle-adapter-go
          test -f artifacts/merkle-${{ matrix.rid }}/workers/python/merkle-adapter-python.pyz
          test -f artifacts/merkle-${{ matrix.rid }}/workers/java/merkle-adapter-java.jar
          test -f artifacts/merkle-${{ matrix.rid }}/adapters.json
          printf '%s' '{"protocolVersion":"1.0","requestId":"smoke","operation":"describe","payload":{}}' \
            | artifacts/merkle-${{ matrix.rid }}/workers/go/merkle-adapter-go \
            | grep -q '"language":"golang"'
      - name: Package
        shell: bash
        run: |
          tar -C artifacts -czf artifacts/merkle-${{ matrix.rid }}.tar.gz merkle-${{ matrix.rid }}
          shasum -a 256 artifacts/merkle-${{ matrix.rid }}.tar.gz > artifacts/merkle-${{ matrix.rid }}.tar.gz.sha256
      - uses: actions/attest@v4
        with:
          subject-path: artifacts/merkle-${{ matrix.rid }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/merkle-${{ matrix.rid }}.tar.gz
            artifacts/merkle-${{ matrix.rid }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --verify-tag --generate-notes
